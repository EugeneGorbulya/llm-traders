# Where the Ollama models run. CUDA and Metal answer differently, so the platform
# is part of the cache key and all runs of a model stay on one platform.
# a100: rented VM, reached through `ssh -N -L 11435:localhost:11434 <vm>`. A port
# other than 11434 keeps a run from landing on the Mac's own Ollama by mistake.
# The Mac pilot of 8.11 (results/mac/) ran with platform mac, url :11434.
ollama:
  platform: a100
  url: http://localhost:11435

models:
  # max_tokens caps a runaway answer (a model looping inside the JSON);
  # think models need room for the reasoning, which counts too.
  qwen3-4b:
    backend: ollama
    max_tokens: 512
    model: qwen3:4b-instruct-2507-q4_K_M
    options: {temperature: 0.7, top_p: 0.8, top_k: 20}
    think: null
  qwen3-8b:
    backend: ollama
    max_tokens: 512
    model: qwen3:8b
    options: {temperature: 0.7, top_p: 0.8, top_k: 20}
    think: false
  qwen3-14b:
    backend: ollama
    max_tokens: 512
    model: qwen3:14b
    options: {temperature: 0.7, top_p: 0.8, top_k: 20}
    think: false
  qwen3-14b-think:
    backend: ollama
    max_tokens: 6144
    model: qwen3:14b
    options: {temperature: 0.6, top_p: 0.95, top_k: 20}
    think: true
  llama3.1-8b:
    backend: ollama
    max_tokens: 512
    model: llama3.1:8b
    options: {temperature: 0.6, top_p: 0.9}
    think: null
  gpt-oss-20b-low:
    backend: ollama
    max_tokens: 2048
    model: gpt-oss:20b
    options: {temperature: 1.0, top_p: 1.0}
    think: low
  # 6144 tokens cut 12 of 81 pilot answers mid-reasoning (8.11), the hard ones
  # (conflicting signals) more often. num_ctx must hold the prompt and the answer.
  gpt-oss-20b-high:
    backend: ollama
    max_tokens: 12288
    model: gpt-oss:20b
    options: {temperature: 1.0, top_p: 1.0, num_ctx: 16384}
    think: high

  # для API-моделей (гейт 1, если будет доступ)
  gpt-4o-mini:
    backend: openai_compat
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    options: {temperature: 0.7}
  gemini-flash-lite:
    backend: openai_compat
    model: TODO-gemini-3.1-flash-lite-model-id
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    options: {temperature: 0.7}
  claude-haiku:
    backend: anthropic
    model: TODO-claude-haiku-5-5-model-id
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 1024
    options: {}

  mock-rational:
    backend: mock
    model: mock
    extra: {policy: rational}
  mock-gullible:
    backend: mock
    model: mock
    extra: {policy: gullible}
  mock-broken:
    backend: mock
    model: mock
    extra: {policy: broken}
  mock-garbage:
    backend: mock
    model: mock
    extra: {policy: garbage}
