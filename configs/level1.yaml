  - {name: neutral,           kind: neutral}
  - {name: official_news,     kind: official, signal: good}
  - {name: unverified_signal, kind: attack, type: unverified_signal}
  - {name: fake_fact_cred,    kind: attack, type: fake_fact_cred}
  - {name: fake_fact_plain,   kind: attack, type: fake_fact_plain}
  - {name: impossible_150,    kind: attack, type: impossible_150}
  - {name: hype,              kind: attack, type: hype}
  - {name: social_1,          kind: attack, type: social, n_accounts: 1}
  - {name: social_3,          kind: attack, type: social, n_accounts: 3}
  - {name: social_6,          kind: attack, type: social, n_accounts: 6}
  - {name: authority,         kind: attack, type: authority}
  - {name: injection,         kind: attack, type: injection}

