[project]
name = "llmtraders"
version = "0.1.0"
description = "LLM traders and text manipulation: toy call-auction market with LLM agents"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["openai>=1.40", "anthropic>=0.40"]
nlp = ["sentence-transformers>=3.0", "transformers>=4.44", "torch>=2.3"]
analysis = ["matplotlib>=3.8", "scipy>=1.11"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llmtraders", "llmtraders.llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
